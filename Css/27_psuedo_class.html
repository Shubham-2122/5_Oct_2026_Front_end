<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul li:first-child{
            background-color: lightcoral;
        }
        ul li:last-child{
            background-color: aqua;
        }
        ul li:nth-child(5){
            background-color: lightgreen;
        }
        ul li:nth-child(even){
            background-color: lightgreen;
        }
        ul li:nth-child(odd){
            background-color: lightseagreen;
        }
        ul li:nth-last-child(1){
            background-color: aqua;
        }
        .main{
            height: 200px;
            width: 200px;
            border: 2px solid;
            transition: 1s;
        }
        .main:hover{
            background-color: lawngreen;
            transform: translate(100px);
            border-radius: 60px;
        }
        input:focus{
            background-color: lightcoral;
            color: white;
        }
    </style>
</head>
<body>
    <!-- : = class 
    :: = element -->

    <ul>
        <li>home</li>
        <li>About</li>
        <li>contact</li>
        <li>help</li>
        <li>het</li>
        <li>pages</li>
        <li>homsade</li>
        <li>home</li>
        <li>homasde</li>
    </ul>

    <div class="main">

    </div>

    <!-- hover 
        1) prenet to prenet 
        2_ prenet to child allow 
    -->

    <input type="text" placeholder="Entrer your name">

</body>
</html>
