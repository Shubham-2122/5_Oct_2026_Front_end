<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            list-style: none;
        }
        ul li{
            display: inline-block;
            background-color: lightcoral;
            padding: 10px 20px;
            position: relative;
        }
        ul li a{
            color: white;
            text-decoration: none;
        }
        ul li::after{
            position: absolute;
            content: "";
            background-color: black;
            width: 100%;
            height: 5px;
            top: 100%;
            left: 0;
            transition: .6s;
            transform: scaleX(0);
        }

        li:hover::after{
            transform: scaleX(1);
        }


    </style>
</head>
<body>
    <ul>
        <li><a href="">Home</a></li>
        <li><a href="">About</a></li>
        <li><a href="">Contact</a></li>
        <li><a href="">help</a></li>

    </ul>
</body>
</html>
