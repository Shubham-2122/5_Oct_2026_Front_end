<body>
    <!-- siwtch : case deffrent type data to store value  -->

    <script>

        let a = 20,b=10;
        let choice = "&";

        switch (choice) {
            case "+":
                console.log("Sum :",a+b)
                break;
            case "-":
                console.log("Sub :",a-b)
                break

            case "*":
                console.log("mul :",a*b)
                break
            case "/":
                console.log("Divi",a/b)
                break

            default:
                console.log("invalid symbole")
                break;
        }
    </script>
