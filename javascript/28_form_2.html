<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" >
        <div>
            <input type="text" id="nm" onblur="return validation(nm,nmerr)" placeholder="Enter your Name">
            <span id="nmerr"></span>
        </div>
        <div>
            <input type="text" id="snm" onblur="return validation(snm,snmerr)" placeholder="Enter your SurName">
            <span id="snmerr"></span>
        </div>
        <div>
            <input id="em" type="email" onblur="return validation(em,emerr)" placeholder="Enter your email">
            <span id="emerr"></span>
        </div>
        <div>
            <input type="tel" id="mb" onblur="return validation(mb,mberr)" placeholder="Enter your mobile">
            <span id="mberr"></span>
        </div>
        <div>
            <input type="password" id="psw" onblur="return validation(psw,pswerr)" placeholder="Enter your Password">
            <span id="pswerr"></span>
        </div>
        
        <div>
            <input type="submit">
        </div>
    </form>

    <script>

        function validation(inp,err){
            if(inp.value == "" || inp.value == null){
                err.innerHTML = "pls require data"
                err.style.color = "red"
                inp.style.border = "2px solid red"
                return false
            }
            else{
                err.innerHTML = ""
                inp.style.border = "2px solid green"
            }
        }

      </script>

</body>
</html>
