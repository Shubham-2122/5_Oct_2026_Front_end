    <!-- varibale : it's siple value store in varibale  -->

    <!-- rules : 
     
    1) so not start with number 
    2) do not start with symbols 
    3) do not start with keyword

    -->

    <!-- syntax : 

    type variba-name = value  -->


    <script>

        // 1) var : global
        var a = 10  // declaration 
        var a = 15 // re-declaration allow 
        a = 17 // re-assigement allow 

        console.log("A : ",a)


        // 2) let : local 

        let b = 20 //delacrion allow 
        // let b = 25 // re-declartion not allow 
        b = 30 // re-aasisgement allow  

        console.log("b :",b)

        // 3) const : unique , block
        const z = 60 //decalrtion allow 
        // const z = 80 // re-declartion not allow 
        // z = 90  // re-aasisgement not allow
