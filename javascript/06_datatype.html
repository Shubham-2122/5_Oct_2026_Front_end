<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- datat type : 
     
    1) primitve  : only one value 
    2) no primitve : one and more value
    -->


    <script>

            // primive 7 type 

            // 1) number 

            let num = 34.56 
            console.log("Num",num)
            console.log(typeof(num))

            // 2) string 
            let test = "shubham jadav"
            console.log(test)
            console.log(typeof(test))

            // 3) boolen 
            let demo = false 
            console.log(demo)

            console.log(typeof(demo))

            // 4) undefind 
            let ab;
            console.log(ab)
            console.log(typeof(ab))


            // 5) null 
            let test1 = null 
            console.log(test1)
            console.log(typeof(test1))

            // 6) bigint
            
            let nm = BigInt(32535345634)
            console.log(nm)

            console.log(typeof(nm))

            // 7) symbols 
            let ji = Symbol("sdfsd")
            console.log(ji)
            console.log(typeof(ji))

    </script>
    

</body>
</html>
