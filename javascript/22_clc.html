<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" placeholder="Enter your Num1 " value="" id="num1" >
    <input type="text" placeholder="Enter your Num2 " id="num2" >
    <br>
    <button onclick="sum()">Sum</button>
    <button onclick="sub()">Sub</button>

    <h1 id="show"></h1>
    <script>

        let num1 = document.getElementById("num1")
        let num2 = document.getElementById("num2")

        // console.log(num1)
        // console.log(num2)

        function sum(){
            let final = parseFloat(num1.value) + parseFloat(num2.value) 
            console.log("Sum : ",final)
            // document.getElementById("show").innerHTML = "sum :"+final
             document.getElementById("show").innerHTML = `Sum = ${final}`
        }

         function sub(){
            let final = parseFloat(num1.value) - parseFloat(num2.value) 
            console.log("Sub : ",final)
      
             document.getElementById("show").innerHTML = `Sub = ${final}`
        }

        

    </script>

</body>
</html>
