<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .test{
            background: linear-gradient(red,green,blue);
            color: white;
            font-size: 50px;
            text-align: center;
            font-weight: 900;
            padding: 50px;
        }
    </style>
</head>
<body>

    <button onclick="addstyle()">Add style</button>
    <button onclick="removestyle()">remove style</button>
    <button onclick="togglecss()">Toggle</button>

    <h1 id="h1">Hello data</h1>


    <script>
        let h1_tag = document.getElementById("h1")

        function addstyle(){
            h1_tag.classList.add("test")
        }

        function removestyle(){
            h1_tag.classList.remove("test")
        }

        function togglecss(){
            h1_tag.classList.toggle("test")
        }

    </script>

</body>
</html>
