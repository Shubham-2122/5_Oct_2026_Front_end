<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1 id="h1" onmouseenter="test()" onmouseleave="test1()">Hello data</h1>

    <button onclick="test()">Click me</button>


    <script>
        let h1_tag = document.getElementById("h1")
        function test(){
            h1_tag.innerHTML = "hello shubham"
            h1_tag.style.background = "red"
        }

         function test1(){
            h1_tag.innerHTML = "hello data"
            h1_tag.style.background = "white"
        }
    </script>

</body>
</html>
