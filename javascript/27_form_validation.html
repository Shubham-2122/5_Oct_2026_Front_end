<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" onsubmit="return getsubmit()">
        <div>
            <input type="text" id="nm" placeholder="Enter your Name">
            <span id="nmerr"></span>
        </div>
        <div>
            <input type="text" id="snm" placeholder="Enter your SurName">
            <span id="snmerr"></span>
        </div>
        <div>
            <input id="em" type="email" placeholder="Enter your email">
            <span id="emerr"></span>
        </div>
        <div>
            <input type="tel" id="mb" placeholder="Enter your mobile">
            <span id="mberr"></span>
        </div>
        <div>
            <input type="password" id="psw" placeholder="Enter your Password">
            <span id="pswerr"></span>
        </div>
        <div>
            <input id="cpsw" type="password" placeholder="Enter your CPassword">
        </div>
        <div>
            <input type="submit">
        </div>
    </form>

    <script>

        let nm_tag = document.getElementById("nm")
        let nmerr = document.getElementById("nmerr")
        
        let snm_tag = document.getElementById("snm")
        let snmerr = document.getElementById("snmerr")

        
        let em_tag = document.getElementById("em")
        let emerr = document.getElementById("emerr")
  
        
        let mb_tag = document.getElementById("mb")
        let mberr = document.getElementById("mberr")

        
        let psw_tag = document.getElementById("psw")
        let pswerr = document.getElementById("pswerr")
  
        
        let cpsw_tag = document.getElementById("cpsw")
        

        function getsubmit(){
            if(nm_tag.value == "" || nm_tag.value == null){
                nmerr.innerHTML = "pls Name required"
                nmerr.style.color = "red"
                return false
            }
            else{
                nmerr.innerHTML = ""
            }

            if(snm_tag.value == "" || snm_tag.value == null){
                snmerr.innerHTML = "pls SurName required"
                snmerr.style.color = "red"
                return false
            }
            else{
                snmerr.innerHTML = ""
            }
                 if(em_tag.value == "" || em_tag.value == null){
                emerr.innerHTML = "pls Email required"
                emerr.style.color = "red"
                return false
            }
            else{
                emerr.innerHTML = ""
            }
            
                 if(mb_tag.value == "" || mb_tag.value == null){
                mberr.innerHTML = "pls mobile required"
                mberr.style.color = "red"
                return false
            }
            else{
                mberr.innerHTML = ""
            }
                 if(psw_tag.value == "" || psw_tag.value == null){
                pswerr.innerHTML = "pls Password required"
                pswerr.style.color = "red"
                return false
            }
            else{
                pswerr.innerHTML = ""
            }

            if(psw_tag.value != cpsw_tag.value){
                alert("Password Does not Match")
                return false
            }

        }

  </script>

</body>
</html>
