<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- <input type="text" id="inp" onkeypress="test()"> -->

    <input type="text" id="inp" onkeyup="test()" >
    <textarea name="" id="text" rows="10" cols="30"></textarea>
    <button onclick="test()">add data</button>

    <script>

        let inp_tag = document.getElementById("inp")
        let text_tag = document.getElementById("text")

        function test(){
            text_tag.innerText = inp_tag.value
        }

    </script>

</body>
</html>
