<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!-- while loop are enter control loop kevema aave che

    -->

    <script>
        // for()


        let x = 1
        while (x <= 10) {
            console.log(x)
            x++
        }

        x = 10
        while (x >= 1) {
            console.log(x)
            x--
        }
    </script>
</body>

</html>
